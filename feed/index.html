<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Slingshot — the feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --rail:#ffffff; --accent:#fe2c55; --em:#10b981; --amb:#fbbf24; --slate:#0f172a; --slate2:#1e293b; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--slate);color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
  #feed::-webkit-scrollbar{display:none}
  .card{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
  .bg{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .scene{font-size:17vh;line-height:1.1;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
  .scene small{display:block;font-size:5vh}
  video.clip{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .25s}
  video.clip.ready{opacity:1}
  .slot{position:absolute;top:calc(env(safe-area-inset-top,0px) + 46px);left:12px;z-index:6;
    font-size:10px;color:rgba(255,255,255,.45);background:rgba(0,0,0,.35);
    border:1px dashed rgba(255,255,255,.25);border-radius:6px;padding:3px 7px}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 25%,transparent 60%,rgba(0,0,0,.55));pointer-events:none}
  /* progress */
  #progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:3px;padding:6px 8px;z-index:20}
  #progress i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.25)}
  #progress i.done{background:var(--amb)}
  /* right rail */
  .rail{position:absolute;right:8px;bottom:120px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:8}
  .rail .avatar{width:48px;height:48px;border-radius:50%;border:1.5px solid #fff;overflow:hidden;background:#222;position:relative}
  .rail .avatar svg{width:100%;height:100%;display:block}
  .rail .avatar .plus{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:18px;height:18px;
    border-radius:50%;background:var(--em);color:#fff;font-size:14px;line-height:17px;text-align:center;font-weight:700}
  .rail button{background:none;border:0;color:var(--rail);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:0}
  .rail button svg{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .rail button.liked svg{fill:var(--accent)}
  .rail button.marked svg{fill:var(--amb)}
  .rail .n{font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  /* meta */
  .meta{position:absolute;left:12px;right:76px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:8}
  .user{font-weight:700;font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
  .user .follow{margin-left:8px;font-size:12px;font-weight:600;color:#fff;border:1px solid #fff;
    border-radius:4px;padding:1px 8px;background:none;cursor:pointer;vertical-align:middle}
  .user .follow.on{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.3)}
  .cap{margin-top:6px;font-size:14.5px;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,.7)}
  .tags{color:#7dd3fc;font-weight:600}
  .sound{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px;width:70%;overflow:hidden;white-space:nowrap}
  .sound .txt{display:inline-block;animation:mq 8s linear infinite}
  @keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  /* sound toggle + cue */
  #soundBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:10px;z-index:22;background:rgba(15,23,42,.55);
    border:0;color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer}
  #cue{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);right:10px;z-index:22;background:rgba(0,0,0,.55);
    border-radius:16px;padding:6px 12px;font-size:12.5px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  /* heart burst */
  .burst{position:absolute;z-index:15;font-size:70px;pointer-events:none;animation:pop .8s ease-out forwards}
  @keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}25%{transform:scale(1.15) rotate(6deg);opacity:1}
    100%{transform:scale(1) translateY(-70px);opacity:0}}
  /* comments sheet */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--slate);border-radius:14px 14px 0 0;
    max-height:62dvh;transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column}
  #sheet.open{transform:translateY(0)}
  #sheet header{display:flex;justify-content:center;align-items:center;padding:12px;font-size:13px;color:#bbb;position:relative}
  #sheet header b{color:#fff}
  #sheet .x{position:absolute;right:12px;top:8px;background:none;border:0;color:#999;font-size:20px;cursor:pointer}
  #clist{overflow-y:auto;padding:0 14px 10px}
  .cmt{display:flex;gap:10px;margin-bottom:14px;font-size:14px}
  .cmt .cav{width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden;background:#333}
  .cmt .cav svg{width:100%;height:100%}
  .cmt .who{font-size:12px;color:#999}
  .cmt .lk{margin-left:auto;color:#777;font-size:12px;flex:none}
  #cbar{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid #334155}
  #cbar input{flex:1;background:var(--slate2);border:0;border-radius:18px;color:#fff;padding:9px 14px;font-size:14px;outline:none}
  #cbar button{background:none;border:0;color:var(--em);font-weight:700;font-size:14px;cursor:pointer}
  /* toast */
  #toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:rgba(30,41,59,.95);
    color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  /* text + final cards */
  .textcard{padding:0 min(9vw,48px);font-size:min(7.2vw,34px);font-weight:800;line-height:1.35;text-align:left;max-width:560px}
  .textcard em{color:var(--amb);font-style:normal}
  .playbtn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;text-decoration:none;
    font-size:20px;font-weight:800;padding:16px 42px;border-radius:32px;box-shadow:0 6px 30px rgba(254,44,85,.45)}
  .ghlink{display:block;margin-top:16px;color:#9aa0b4;font-size:13px;text-decoration:none}
  /* cover card — the website's design */
  .cover{position:absolute;inset:0;overflow:hidden;
    background:linear-gradient(135deg,#1a1a2e 0%,#16162a 50%,#1a1a2e 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw;
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif}
  .cover > *:not(video){position:relative;z-index:2}
  .cover video.clip{z-index:1}
  .cover img.logo{width:36vw;max-width:180px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .cover h1{margin:18px 0 0;font-size:9vw;font-weight:700;letter-spacing:-.02em;color:#fff}
  .cover .tag{margin-top:6px;font-size:4vw;color:#c7d2fe;font-weight:500}
  .cover .enter{margin-top:6vh;font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:#94a3b8;
    animation:flicker 3.2s infinite}
  .cover .enter b{display:block;margin-top:6px;color:#fbbf24;letter-spacing:.18em;font-size:13.5px}
  .cover .arrow{margin-top:2.5vh;font-size:26px;color:#c7d2fe;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(8px)}}
  @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.55}96%{opacity:1}}
  /* game-styled final card */
  .gamecard{position:absolute;inset:0;background:linear-gradient(90deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw}
  .gamecard .hbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 12px;
    background:linear-gradient(90deg,#0f172a,#1e293b,#0f172a);border-bottom:2px solid #f59e0b;
    font-weight:900;letter-spacing:.12em;color:#fbbf24;font-size:15px;text-align:left}
  .gamecard .hbar small{display:block;color:#94a3b8;font-weight:600;letter-spacing:.02em;font-size:11px;margin-top:2px}
  .gamecard h2{font-size:7.5vw;font-weight:900;margin:0;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif}
  .gamecard .rocket{font-size:10vh;margin:1.5vh 0;filter:drop-shadow(0 0 24px rgba(16,185,129,.5))}
  .stats{display:flex;gap:10px;margin-top:2vh;flex-wrap:wrap;justify-content:center}
  .stat{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 14px;font-size:12.5px;color:#cbd5e1}
  .stat b{display:block;color:#10b981;font-size:16px}
  .playbtn2{display:inline-block;margin-top:3.5vh;background:linear-gradient(180deg,#10b981,#059669);color:#fff;
    text-decoration:none;font-size:19px;font-weight:800;padding:15px 44px;border-radius:10px;
    border:1px solid #34d399;box-shadow:0 6px 28px rgba(16,185,129,.4)}
  .cover .ghlink{color:#64748b}
  @media (prefers-reduced-motion: reduce){ .sound .txt,#cue,.cover .arrow,.cover .enter{animation:none} }
</style>
</head>
<body>
<div id="progress"></div>
<button id="soundBtn" aria-label="toggle sound">🔇</button>
<div id="cue">tap for sound 🔊</div>
<main id="feed" aria-label="The Slingshot tutorial feed"></main>

<div id="sheet" role="dialog" aria-label="comments">
  <header><b id="ccount"></b>&nbsp;comments <button class="x" id="cclose" aria-label="close">✕</button></header>
  <div id="clist"></div>
  <div id="cbar"><input id="cinput" placeholder="add a comment…" aria-label="add a comment">
  <button id="csend">Post</button></div>
</div>
<div id="toast"></div>

/* progress + current card + video lifecycle */
let current = 0, muted = true;
const cards = [...document.querySelectorAll(".card")];
const segs = [...prog.children];
const soundBtn = document.getElementById("soundBtn");
const cue = document.getElementById("cue");

function ensureVideo(i){
  const c = CARDS[i]; if(!c || c.text) return;
  const sec = cards[i];
  if (sec.querySelector("video")) return;
  const v = document.createElement("video");
  v.className="clip"; v.src = "media/"+c.id+".mp4";
  v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute("playsinline","");
  v.preload = "metadata";
  v.addEventListener("canplay", ()=> v.classList.add("ready"));
  v.addEventListener("error", ()=> v.remove());
  const cover = sec.querySelector(".cover");
  if ((c.zone || c.final) && cover) cover.insertBefore(v, cover.firstChild);   // behind the title, above the gradient
  else sec.insertBefore(v, sec.querySelector(".shade"));
}

/* temporary on-screen diagnostics */
const dbg = document.createElement("div");
dbg.style.cssText = "position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 34px);z-index:99;background:rgba(0,0,0,.6);color:#0f0;font:10px monospace;padding:3px 6px;border-radius:4px;pointer-events:none;max-width:80vw";
document.body.appendChild(dbg);
let _s = 0, _o = 0, _lastErr = "";
window.addEventListener("error", e => { _lastErr = (e.message||"?") + " L" + (e.lineno||"?"); upDbg(); });
function upDbg(){
  dbg.textContent = "i=" + current + " vids=" + document.querySelectorAll("video").length +
    " S:" + _s + " O:" + _o + (_lastErr ? " ERR:" + _lastErr : "");
}
function activate(i){
  if (i < 0 || i >= cards.length) return;
  current = i;
  segs.forEach((s,k)=> s.classList.toggle("done", k<=i));
  ensureVideo(i); ensureVideo(i+1);
  cards.forEach((sec,k)=>{
    const v = sec.querySelector("video");
    if (!v) return;
    if (k === i){ v.muted = muted; v.play().catch(()=>{}); }
    else if (!v.paused) v.pause();
  });
}
const io = new IntersectionObserver(es=>{
  _o++;
  es.forEach(e=>{
    if (e.isIntersecting && e.intersectionRatio > .55) activate(+e.target.dataset.i);
  });
  upDbg();
},{threshold:[0,.6,1]});
cards.forEach(c=>io.observe(c));
let scrollTimer;
feed.addEventListener("scroll", ()=>{
  _s++;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(()=>{
    const i = Math.round(feed.scrollTop / feed.clientHeight);
    if (i !== current) activate(i);
    else {
      ensureVideo(i); ensureVideo(i+1);
      const v = cards[i] && cards[i].querySelector("video");
      if (v && v.paused){ v.muted = muted; v.play().catch(()=>{}); }
    }
    upDbg();
  }, 120);
}, {passive:true});
for (let k = 0; k < cards.length; k++) ensureVideo(k);
activate(0); upDbg();

/* sound */
function setMuted(m){
  muted = m;
  soundBtn.textContent = m ? "🔇" : "🔊";
  const v = cards[current].querySelector("video");
  if (v){ v.muted = m; if(!m) v.play().catch(()=>{}); }
  if (!m) cue.style.display = "none";
}
soundBtn.addEventListener("click", ()=> setMuted(!muted));
cue.addEventListener("click", ()=> setMuted(false));

/* taps: single = pause/play, double = like */
let lastTap = 0, tapTimer;
feed.addEventListener("click", ev=>{
  if (ev.target.closest(".rail,.meta,a,button")) return;
  const now = Date.now();
  if (now - lastTap < 300){
    clearTimeout(tapTimer);
    doLike(current, ev.clientX, ev.clientY, true);
  } else {
    tapTimer = setTimeout(()=>{
      const v = cards[current].querySelector("video");
      if (v) v.paused ? v.play() : v.pause();
    }, 300);
  }
  lastTap = now;
});

function doLike(i, x, y, forceOn){
  const c = CARDS[i], sec = cards[i];
  const btn = sec.querySelector(".like"), n = btn.querySelector(".n");
  const key = "like_"+c.id;
  if (forceOn && store[key]) { burst(sec,x,y); return; }
  store[key] = !store[key]; save();
  btn.classList.toggle("liked", !!store[key]);
  n.textContent = fmt(c.likes + (store[key]?1:0));
  if (store[key] && x!==undefined) burst(sec,x,y);
}
function burst(sec,x,y){
  const h = document.createElement("div");
  h.className="burst"; h.textContent="❤️";
  const r = sec.getBoundingClientRect();
  h.style.left=(x-r.left-35)+"px"; h.style.top=(y-r.top-35)+"px";
  sec.appendChild(h); setTimeout(()=>h.remove(), 850);
}

/* rail buttons */
feed.addEventListener("click", ev=>{
  const sec = ev.target.closest(".card"); if(!sec) return;
  const i = +sec.dataset.i, c = CARDS[i];
  if (ev.target.closest(".like")) doLike(i, undefined, undefined, false);
  if (ev.target.closest(".mark")){
    const key="mark_"+c.id; store[key]=!store[key]; save();
    const b = sec.querySelector(".mark");
    b.classList.toggle("marked", !!store[key]);
    b.querySelector(".n").textContent = store[key]?"saved":"save";
  }
  if (ev.target.closest(".share")){
    (navigator.share ? navigator.share({title:"The Slingshot", url:GAME_URL}).catch(()=>{}) :
      navigator.clipboard.writeText(GAME_URL).then(()=>toast("link copied — send it")));
  }
  if (ev.target.closest(".follow")){
    const key="fol_"+c.id; store[key]=!store[key]; save();
    const f = sec.querySelector(".follow");
    f.classList.toggle("on", !!store[key]);
    f.textContent = store[key] ? "Following" : "Follow";
  }
  if (ev.target.closest(".cbtn")) openSheet(i);
});

/* comments */
const sheet=document.getElementById("sheet"), clist=document.getElementById("clist"),
 ccount=document.getElementById("ccount"), cinput=document.getElementById("cinput");
function openSheet(i){
  const c = CARDS[i];
  ccount.textContent = fmt(c.comments.length*137+58);
  clist.innerHTML = c.comments.map(([who,txt,lk])=>`
    <div class="cmt"><div class="cav">${AVATARS[who]||""}</div>
    <div><div class="who">${who}</div>${txt}</div><div class="lk">❤ ${lk}</div></div>`).join("");
  sheet.classList.add("open"); sheet.dataset.i = i;
}
document.getElementById("cclose").addEventListener("click", ()=> sheet.classList.remove("open"));
document.getElementById("csend").addEventListener("click", ()=>{
  const t = cinput.value.trim(); if(!t) return;
  clist.insertAdjacentHTML("afterbegin",
   `<div class="cmt"><div class="cav"><div style="width:100%;height:100%;display:grid;place-items:center">🫵</div></div>
    <div><div class="who">you</div>${t.replace(/</g,"&lt;")}</div><div class="lk">❤ 0</div></div>`);
  cinput.value=""; toast("posted (to this device, anyway)");
});

/* toast + keys */
const toastEl=document.getElementById("toast");
let tt; function toast(m){ toastEl.textContent=m; toastEl.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove("on"),1800); }

/* final card: send the game link to yourself */
function sendYourself(){
  if (navigator.share){
    navigator.share({title:"The Slingshot", text:"play it on a laptop:", url:GAME_URL}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(GAME_URL).then(()=>toast("link copied — see you on the big screen"))
      .catch(()=>toast(GAME_URL));
  }
}
document.addEventListener("keydown", e=>{
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    const next = Math.min(Math.max(current+(e.key==="ArrowDown"?1:-1),0),cards.length-1);
    cards[next].scrollIntoView({behavior:"smooth"});
  }
  if (e.key===" "){ e.preventDefault();
    const v=cards[current].querySelector("video"); if(v) v.paused?v.play():v.pause(); }
  if (e.key==="Escape") sheet.classList.remove("open");
});

</script>
