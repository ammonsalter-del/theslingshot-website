<!-- FAQPage structured data for The Slingshot, built from the FAQ on the For Educators page.
     Paste into the <head> of the page that carries the visible FAQ (educators.html).
     The visible questions and answers on the page must match these, or Google flags the markup.
     Verify against the live page before publishing. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    { "@type": "Question", "name": "What is The Slingshot?", "acceptedAnswer": { "@type": "Answer", "text": "A free, open-source simulation of founding and running an AI startup, built for teaching entrepreneurship. Players run a UK AI venture quarter by quarter across four years, completing milestones before money or time runs out." } },
    { "@type": "Question", "name": "Is it really free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Playing the game costs nothing, for students, educators and anyone else. The educator pack is also free. There are no accounts to buy, no per-seat licences and no premium tier." } },
    { "@type": "Question", "name": "How long does a session take?", "acceptedAnswer": { "@type": "Answer", "text": "A game takes twenty-five to forty minutes, depending on a player's knowledge and experience with the game; returning players are quicker. That fits inside a single teaching session with time left for a debrief, or works as preparation before class." } },
    { "@type": "Question", "name": "What do students need?", "acceptedAnswer": { "@type": "Answer", "text": "A modern web browser. Nothing to install, nothing to pay, no accounts to create, and no personal or student data is collected." } },
    { "@type": "Question", "name": "What courses and levels does it suit?", "acceptedAnswer": { "@type": "Answer", "text": "Entrepreneurship, entrepreneurial strategy, innovation management, technology venturing and technology commercialisation, at undergraduate, postgraduate and executive levels. The three modes (Seed, Core, Extreme) let you match difficulty to the cohort." } },
    { "@type": "Question", "name": "What do students learn?", "acceptedAnswer": { "@type": "Answer", "text": "Entrepreneurial strategy in a nascent industry, where markets, categories and rules are still forming and there is rarely a single right answer; strategic decision-making under uncertainty; entrepreneurial finance, including runway, dilution, term sheets and non-dilutive grants; technology venturing and commercialisation, turning advanced technology into a business; university-industry interaction, engaging the science base that sits upstream of a deep-tech venture, deciding whether to publish or protect, and building university partnerships; managing investors, regulators, customers and partners; and learning through failure and structured reflection." } },
    { "@type": "Question", "name": "How does it compare with other entrepreneurship simulations?", "acceptedAnswer": { "@type": "Answer", "text": "The Slingshot is free and open source, runs in the browser in twenty-five to forty minutes with no setup, is grounded in published research on AI ventures and the UK ecosystem, and comes with a free educator pack. Educators should judge any simulation against their cohort and learning objectives; those attributes are what The Slingshot offers." } },
    { "@type": "Question", "name": "Is it based on research?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, in both its theory and its content. The game builds on the attention-based view of the firm (Ocasio, 1997): attention is the scarce resource, and the game's central tension is allocating it between competing goals, building internal capability while engaging the outside world that holds the resources a venture needs. That tension is also the question of the ESRC-funded project behind the game, Profiting from Science (ES/X003949/1), which studies how AI ventures form, grow and engage the science base. Its market-entry system embeds the Where to Play framework (Gruber and Tal, 2017), and its 550+ events draw on the literature on technology venturing." } },
    { "@type": "Question", "name": "Who built it?", "acceptedAnswer": { "@type": "Answer", "text": "The Slingshot was designed by Ammon Salter (Warwick Business School), who built it with AI models, mainly Claude, and maintains it. He set the design, dictated the content and the educator materials and tested every build; the models wrote the code to his instructions. No studio or programmer was involved. Nothing in the game itself is generated while you play: every event, character and line of text was written in advance and checked and approved by him, so players only ever meet material that has been reviewed. Ada and Schumpeter, the two companions, are different. They run on Claude, on the player's own account, and were written to keep them from drifting; Claude was chosen for its stronger safety guardrails. Even so, a language model can make mistakes and say things that are wrong or inappropriate. The game came out of the ESRC-funded project Profiting from Science (ES/X003949/1), on which Stefano Baruffaldi (Politecnico di Milano) is co-investigator and Federico Bignone (Warwick Business School) is research fellow. Federico Bignone shaped the game's mechanics and systems and playtested every version, and his research on AI ventures and Innovate UK funding informed the game's treatment of the science base and grant funding. It is an open, not-for-profit educational project, licensed CC BY-NC-SA 4.0. Cite it as Salter, Baruffaldi and Bignone (2026)." } },
    { "@type": "Question", "name": "Can I use it for assessment?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, through reflection rather than results. Game outcomes make a poor measure of learning, because the game has a strong degree of randomness by design and a result reflects luck as well as judgement. What the design supports is a reflective essay: every run ends with a report, a PDF the student keeps, recording the venture's history, and students write about the choices they made during the playthrough, why they made them, and what they would do differently. That reflection is naturally the student's own. Only the student knows why they chose as they did, and the game's detailed mechanics are deliberately hidden, so the insight in a good essay comes from having played and thought, not from anything that can be looked up. The educator pack includes assignment ideas built exactly this way." } },
    { "@type": "Question", "name": "Is it fun?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Students find it challenging and enjoy the challenge; some have played it thirty times. The mini-games add variety to the experience, and provide some surprise and delight during play. As one Master's student put it, “it was a fun and motivating way to experience how business decisions are made under pressure.”" } },
    { "@type": "Question", "name": "What are the mini-games?", "acceptedAnswer": { "@type": "Answer", "text": "Three hands-on mini-games sit inside the simulation, each a key business activity experienced rather than described: working a conference booth to generate leads, delivering a thirty-second investor pitch to venture capitalists, and engaging visitors and closing deals under time pressure at demo day." } },
    { "@type": "Question", "name": "Can students play in teams?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. A team of two to four can share one venture and make every decision jointly, which turns each quarter into a strategic argument, over hiring, funding, markets and pivots, of the kind a real founding team has. A class can also run a shared challenge: everyone starts from the same conditions and races to build the next AI unicorn, the game's ultimate prize, with a shared join code making the cohort its own anonymous leaderboard." } },
    { "@type": "Question", "name": "Can students play competitively?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, in three senses. Inside the game every venture races three named rival firms in its sector. Between players, Core mode includes live competitive benchmarking, so students can compare their run against their class and against everyone who has played, and educators can run zero-cost in-class tournaments with no registration and no personal data captured. And players can compare themselves against themselves: benchmarking across their own earlier runs makes improvement visible from one replay to the next. Seed switches benchmarking off so beginners can learn without it." } },
    { "@type": "Question", "name": "Is it accessible?", "acceptedAnswer": { "@type": "Answer", "text": "Accessibility work against WCAG 2.2 AA is ongoing and expected to complete by autumn 2026." } },
    { "@type": "Question", "name": "How do I cite it?", "acceptedAnswer": { "@type": "Answer", "text": "Salter, A., Baruffaldi, S., & Bignone, F. (2026). The Slingshot: An AI Startup Simulation. Zenodo. https://doi.org/10.5281/zenodo.20749017" } },
    { "@type": "Question", "name": "How do I get the educator pack?", "acceptedAnswer": { "@type": "Answer", "text": "Email ammon.salter@wbs.ac.uk. It is free." } }
  ]
}
</script>
